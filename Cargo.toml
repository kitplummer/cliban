[package]
name = "cliban"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
structopt = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.19"
home = "0.5.11"
exitcode = "1.1.2"
shellexpand = "3.1.0"
comfy-table = "7.1.3"
assert_cmd = "2.0"
predicates = "3.1"
regex = "1.6"

[dependencies.chrono]
version = "0.4.19"
features = ["serde"]
